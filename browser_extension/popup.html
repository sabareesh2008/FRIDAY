<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>ZYRA Bridge</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      width: 240px;
      padding: 12px;
      margin: 0;
      background: #0f172a;
      color: #e2e8f0;
    }
    h3 {
      margin: 0 0 8px 0;
      font-size: 14px;
      color: #38bdf8;
    }
    p {
      font-size: 12px;
      line-height: 1.4;
      margin: 4px 0;
    }
    .status {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      margin-right: 6px;
    }
  </style>
</head>
<body>
  <h3>ZYRA / FRIDAY Bridge</h3>
  <p><span class="status"></span> Active & Connected</p>
  <p>Enables tab listing, switching, specific tab closing, and history searching for your desktop assistant.</p>
</body>
</html>
